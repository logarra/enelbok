<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Astra J Sedan 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed WebGL showroom, floating glass top bar, bottom mode rail, slide-up spec sheet */
:root{
  --bg:#0d1014; --bg2:#151a21; --panel:rgba(20,25,32,.86); --line:rgba(160,180,200,.16);
  --fg:#e8edf2; --muted:#8d99a6; --accent:#f2c230; --accent-ink:#1a1503; --good:#5fd39a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.brand{pointer-events:auto;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:1.65rem;letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.brand p{margin:.3rem 0 0;font-size:.78rem;color:var(--muted);font-family:var(--mono);letter-spacing:.02em}
.topbtns{display:flex;gap:8px;pointer-events:auto;flex-shrink:0}
.icon-btn{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;height:42px;min-width:42px;padding:0 12px;
  display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.9rem;cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.icon-btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
.rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px max(16px,env(safe-area-inset-right,0px)) 2px max(16px,env(safe-area-inset-left,0px));pointer-events:auto;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;
  padding:9px 14px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;cursor:pointer;min-width:84px;text-align:left}
.chip b{font-family:var(--display);font-weight:600;font-size:1.02rem;letter-spacing:.04em;text-transform:uppercase}
.chip small{font-size:.68rem;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:rgba(26,21,3,.7)}
.sub{display:flex;gap:8px;align-items:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));pointer-events:auto;flex-wrap:wrap}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:6px 12px;font-size:.78rem;cursor:pointer;display:flex;gap:6px;align-items:center}
.tg i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.tg.on i{background:var(--good);box-shadow:0 0 8px var(--good)}
.slider{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;flex:1 1 220px;min-width:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.slider label{font-size:.75rem;color:var(--muted);white-space:nowrap}
.slider input{flex:1;accent-color:var(--accent);min-width:0}
.swatches{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 8px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg)}

.card{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  top:calc(env(safe-area-inset-top,0px) + 78px);max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:translateY(-8px);opacity:0;pointer-events:none;transition:.25s}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card .cat{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.card h3{font-family:var(--display);font-size:1.35rem;margin:.15rem 0 .35rem;letter-spacing:.02em;text-wrap:balance}
.card p{margin:0;font-size:.88rem;line-height:1.45;color:#c4ccd5}
.card p .k{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:.55rem 0 .1rem}
.card{max-height:calc(100% - 330px);overflow-y:auto}
@media (max-width:759px){.card{max-height:38%}}
.card .x{position:absolute;top:8px;right:8px;border:0;background:none;width:32px;height:32px;cursor:pointer;color:var(--muted);font-size:1.2rem}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.acts:empty{display:none}.acts button{flex:0 0 auto}
.acts button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;font-size:.8rem;cursor:pointer}
.acts button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.hsrail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;width:100%;padding-bottom:2px}
.hsrail::-webkit-scrollbar{display:none}
.hs{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:6px 11px 6px 6px;font-size:.78rem;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.hs b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.7rem;font-family:var(--mono)}
.hs.on{border-color:var(--accent)}
.hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);font-size:.76rem;color:var(--muted);
  background:rgba(13,16,20,.6);padding:6px 12px;border-radius:999px;white-space:nowrap;transition:opacity .6s;pointer-events:none}

.sheet{position:fixed;z-index:8;left:0;right:0;bottom:0;max-height:82%;background:var(--bg2);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  transform:translateY(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:none}
.sheet header{padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-family:var(--display);font-size:1.6rem;margin:0;text-transform:uppercase;letter-spacing:.02em}
.sheet .lead{margin:.25rem 0 .7rem;color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.tab{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sheet .body{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:.7rem}
dl.specs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);margin:0;border-top:1px solid var(--line)}
dl.specs dt,dl.specs dd{padding:9px 0;border-bottom:1px solid var(--line);margin:0;font-size:.86rem}
dl.specs dt{color:var(--muted)}
dl.specs dd{font-family:var(--mono);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.sect{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:18px 0 6px}
ul.eq{list-style:none;padding:0;margin:0;display:grid;gap:0}
ul.eq li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.86rem}
ul.eq li span:last-child{font-family:var(--mono);font-size:.74rem;white-space:nowrap}
.y{color:var(--good)} .n{color:var(--muted)}
.note{font-size:.76rem;color:var(--muted);line-height:1.5;margin-top:14px}
.pkg{display:flex;gap:6px;margin:4px 0 10px}
.loader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);transition:opacity .5s}
.loader b{font-family:var(--display);font-size:1.4rem;letter-spacing:.1em;text-transform:uppercase}
.loader small{color:var(--muted);font-family:var(--mono);font-size:.75rem}
.err{color:#ff8a7a;max-width:300px;text-align:center;font-size:.85rem}
@media (min-width:760px){.card{left:auto;right:max(16px,env(safe-area-inset-right,0px));top:90px}.sheet{left:auto;right:16px;width:440px;bottom:16px;border-radius:20px;border:1px solid var(--line);max-height:80%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage"></div>

<div class="loader" id="loader"><b>Astra J Sedan</b><small id="loadmsg">Araç modeli yükleniyor…</small></div>

<div class="top">
  <div class="brand">
    <h1>Astra <span>J</span> Sedan</h1>
    <p>2017 · 1.6 Ecotec 115 PS · 5 ileri manuel</p>
  </div>
  <div class="topbtns">
    <button class="icon-btn" id="btnCenter" aria-label="Görünümü ortala"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Ortala</button>
    <button class="icon-btn" id="btnInfo" aria-label="Araç bilgisi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Bilgi</button>
  </div>
</div>

<div class="card" id="card" role="status"><button class="x" id="cardX" aria-label="Kapat">×</button><div class="cat" id="cCat"></div><h3 id="cName"></h3><p id="cDesc"></p><div class="acts" id="cActs"></div></div>
<div class="hint" id="hint">Tek parmak: döndür · İki parmak: yakınlaş / kaydır · Çift dokun: orayı merkez yap</div>

<div class="bottom">
  <div class="sub" id="sub"></div>
  <div class="rail" id="rail"></div>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <header>
    <div class="grab"></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div style="min-width:0"><h2>Opel Astra J Sedan</h2><p class="lead">2017 model · 1.6 Ecotec 115 PS · 5 ileri manuel · Edition</p></div>
      <button class="icon-btn" id="sheetX" aria-label="Kapat">✕</button>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>
  <div class="body" id="sheetBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/libs/meshopt_decoder.js"></script>
<script src="engine.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
if(!window.THREE||!THREE.GLTFLoader){ $('#loadmsg').innerHTML='<span class="err">3D kütüphanesi yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.</span>'; return; }
THREE.ColorManagement.legacyMode=false;

/* ================= helpers ================= */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function rbox(w,h,d,r,seg){
  seg=seg||3; r=Math.min(r,w/2-1e-4,h/2-1e-4,d/2-1e-4);
  const g=new THREE.BoxGeometry(w,h,d,seg*2,seg*2,seg*2),p=g.attributes.position,v=new THREE.Vector3(),c=new THREE.Vector3();
  const hx=w/2-r,hy=h/2-r,hz=d/2-r;
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);c.set(clamp(v.x,-hx,hx),clamp(v.y,-hy,hy),clamp(v.z,-hz,hz));v.sub(c);if(v.lengthSq()>0)v.setLength(r);v.add(c);p.setXYZ(i,v.x,v.y,v.z);}
  g.computeVertexNormals();return g;
}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
function mesh(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);if(x!==undefined)m.position.set(x,y,z);return m;}

/* ================= renderer / scene ================= */
const stage=$('#stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(stage.clientWidth,stage.clientHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.localClippingEnabled=true;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d1014);
scene.fog=new THREE.Fog(0x0d1014,14,30);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new THREE.RoomEnvironment(),0.04).texture;

const camera=new THREE.PerspectiveCamera(40,stage.clientWidth/stage.clientHeight,0.03,80);
camera.position.set(5.6,2.1,4.6);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.62,0);controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=0.01;controls.maxDistance=30;controls.maxPolarAngle=Math.PI*0.58;controls.panSpeed=1.0;controls.rotateSpeed=0.7;
controls.enableZoom=false;controls.screenSpacePanning=true; // zoom is handled below: towards the finger / cursor, not the centre

scene.add(new THREE.HemisphereLight(0xdde6ff,0x1a1d22,0.6));
const sun=new THREE.DirectionalLight(0xffffff,1.7);sun.position.set(4,7,3);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:1,far:20});sun.shadow.bias=-0.0005;
scene.add(sun);
const rim=new THREE.DirectionalLight(0x9fb8ff,0.6);rim.position.set(-5,3,-4);scene.add(rim);
const cabinLight=new THREE.PointLight(0xfff2e0,0,3.2,1.2);cabinLight.position.set(0.1,1.3,0);scene.add(cabinLight);

const floor=new THREE.Mesh(new THREE.CircleGeometry(30,64),new THREE.MeshStandardMaterial({color:0x11151a,roughness:0.9,envMapIntensity:0.05}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const disk=new THREE.Mesh(new THREE.CircleGeometry(3.6,96),new THREE.MeshStandardMaterial({color:0x1a2028,roughness:0.55,metalness:0.2,envMapIntensity:0.12}));
disk.rotation.x=-Math.PI/2;disk.position.y=0.002;disk.receiveShadow=true;scene.add(disk);
const ring=new THREE.Mesh(new THREE.RingGeometry(3.58,3.64,128),new THREE.MeshBasicMaterial({color:0xf2c230,transparent:true,opacity:0.5}));
ring.rotation.x=-Math.PI/2;ring.position.y=0.004;scene.add(ring);
const contact=new THREE.Mesh(new THREE.PlaneGeometry(5.4,2.6),new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,map:canvasTex(256,128,(x,w,h)=>{const g=x.createRadialGradient(w/2,h/2,4,w/2,h/2,w/2);g.addColorStop(0,'rgba(0,0,0,.8)');g.addColorStop(1,'rgba(0,0,0,0)');x.save();x.scale(1,h/w);x.fillStyle=g;x.fillRect(0,0,w,w);x.restore();})}));
contact.rotation.x=-Math.PI/2;contact.position.y=0.006;scene.add(contact);

/* ================= materials for added parts ================= */
const M={
  dash:new THREE.MeshStandardMaterial({color:0x1c1e21,roughness:0.8}),
  dashTrim:new THREE.MeshStandardMaterial({color:0x8e959c,metalness:0.8,roughness:0.3}),
  chrome:new THREE.MeshStandardMaterial({color:0xffffff,metalness:1,roughness:0.1}),
  blackTrim:new THREE.MeshStandardMaterial({color:0x0b0c0e,roughness:0.5}),
  boot:new THREE.MeshStandardMaterial({color:0x101112,roughness:0.6}),
  steel:new THREE.MeshStandardMaterial({color:0x3c4045,metalness:0.8,roughness:0.5}),
  rust:new THREE.MeshStandardMaterial({color:0x5b5a57,metalness:0.6,roughness:0.7}),
  alu:new THREE.MeshStandardMaterial({color:0xa7adb3,metalness:0.85,roughness:0.35}),
  spring:new THREE.MeshStandardMaterial({color:0x1a4fa8,metalness:0.5,roughness:0.4}),
  engineDark:new THREE.MeshStandardMaterial({color:0x1b1c1f,metalness:0.3,roughness:0.6}),
  disc:new THREE.MeshStandardMaterial({color:0x7a7d80,metalness:0.9,roughness:0.45}),
};
const PAINTS=[
  {n:'Power Red',c:0xc0121a},{n:'Summit White',c:0xeceeee},{n:'Sovereign Silver',c:0x9a9fa4},
  {n:'Asteroid Grey',c:0x4c5156},{n:'Carbon Flash',c:0x101214},{n:'Royal Blue',c:0x1f3f7a}
];

/* ================= state ================= */
const CAT={body:'Kaporta',int:'İç mekân',eng:'Motor bölümü',chs:'Şasi & süspansiyon',whl:'Tekerlek & fren',trk:'Bagaj',lgt:'Aydınlatma'};
const S={doors:0,trunk:0,hood:0,explode:0,xray:0,cut:0,bodyHidden:0,spin:0,lights:false,labEx:0};
const T={...S};
const parts=[]; // explode registry
const carRoot=new THREE.Group();scene.add(carRoot);
let DOORS={},trunk=null,hood=null,engineScan=null,CAR_MATS=[],paintMat=null,glassMats=[],bodyNodes=[],interiorAdds=null;
let GEO={FX:1.37,RX:-1.31,WR:0.315,TRACK:0.79,len:4.66};let DASH_BOX=null,dashScan=null;
const cutPlane=new THREE.Plane(new THREE.Vector3(0,-1,0),50); // interior cutaway (removes the roof)
function reg(obj,cat,name,desc,ex){if(name)obj.userData.part={cat,name,desc};parts.push({obj,base:obj.position.clone(),ex:new THREE.Vector3().fromArray(ex||[0,0,0]),cat});return obj;}

/* ================= part catalogue (node names come from the source model) ================= */
const INFO={
  'KAPI_3':[CAT.body,'Sağ ön kapı','Yan darbe kirişli çelik kapı. Elektrikli cam, elektrikli ve ısıtmalı ayna (sinyal tekrarlayıcılı), iç tarafta hoparlör ve kapı döşemesi.'],
  'KAPI_1':[CAT.body,'Sol ön kapı (sürücü)','Sürücü kapısı: tüm camların ve aynaların kumanda paneli, merkezi kilit düğmesi. Elektrikli cam tek dokunuşla iner.'],

const manager=new THREE.LoadingManager();
manager.onProgress=(u,l,t)=>{};
const loader=new THREE.GLTFLoader(manager);loader.setMeshoptDecoder(MeshoptDecoder);
async function fetchBuf(url,label){ // .glb when available, otherwise a base64 text copy (some hosts don't serve .glb)
  $('#loadmsg').textContent=label+'…';
  try{const r=await fetch(url);if(r.ok){const b=await r.arrayBuffer();if(b.byteLength>12&&new TextDecoder().decode(new Uint8Array(b,0,4))==='glTF')return b;}}catch(e){}
  const r=await fetch(url.replace(/\.glb$/,'.b64.txt'));if(!r.ok)throw new Error(url+' bulunamadı');
  const t=(await r.text()).trim(),bin=atob(t),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}
function load(url,label){return fetchBuf(url,label).then(buf=>new Promise((res,rej)=>loader.parse(buf,'',res,rej)));}
load('astra.glb','Araç modeli yükleniyor').then(car=>{buildCar(car.scene);
  return load('dash.glb','İç konsol taraması yükleniyor').then(d=>buildDash(d.scene)).catch(e=>console.warn(e))
    .then(()=>load('engine.glb','Motor taraması yükleniyor')).then(e=>buildEngine(e.scene)).catch(e=>console.warn(e));

function splitTriangles(m,pred){ // move triangles of mesh m that satisfy pred(component) into a new mesh
  const g=m.geometry,pos=g.attributes.position,idx=g.index.array,n=pos.count;
  const key=new Map(),wid=new Int32Array(n);
  for(let i=0;i<n;i++){const k=pos.getX(i).toFixed(4)+','+pos.getY(i).toFixed(4)+','+pos.getZ(i).toFixed(4);let w=key.get(k);if(w===undefined){w=key.size;key.set(k,w);}wid[i]=w;}
  const par=new Int32Array(key.size);for(let i=0;i<par.length;i++)par[i]=i;
  const f=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x];}return x;};
  for(let t=0;t<idx.length;t+=3){const a=f(wid[idx[t]]);par[f(wid[idx[t+1]])]=a;par[f(wid[idx[t+2]])]=a;}
  const comps=new Map();
  for(let t=0;t<idx.length;t+=3){const r=f(wid[idx[t]]);let c=comps.get(r);if(!c){c={tris:[],box:new THREE.Box3()};comps.set(r,c);}c.tris.push(t);for(let k=0;k<3;k++)c.box.expandByPoint(new THREE.Vector3().fromBufferAttribute(pos,idx[t+k]).applyMatrix4(m.matrixWorld));}
  const keep=[],take=[];
  comps.forEach(c=>{const dst=pred(c.box,c.tris.length)?take:keep;c.tris.forEach(t=>dst.push(idx[t],idx[t+1],idx[t+2]));});
  if(!take.length)return null;
  g.setIndex(keep);
  // compact the taken triangles into their own small geometry
  const g2=new THREE.BufferGeometry(),map=new Map(),ni=[];const attrs=Object.keys(g.attributes);const data={};attrs.forEach(a=>data[a]=[]);
  for(const vi of take){let k=map.get(vi);if(k===undefined){k=map.size;map.set(vi,k);attrs.forEach(a=>{const at=g.attributes[a];const gs=['getX','getY','getZ','getW'];for(let c=0;c<at.itemSize;c++)data[a].push(at[gs[c]](vi));});}ni.push(k);}
  attrs.forEach(a=>{const at=g.attributes[a];g2.setAttribute(a,new THREE.BufferAttribute(new Float32Array(data[a]),at.itemSize,false));});
  g2.setIndex(ni);
  const m2=new THREE.Mesh(g2,m.material);m2.matrix.copy(m.matrix);m2.matrix.decompose(m2.position,m2.quaternion,m2.scale);
  m.parent.add(m2);return m2;
}

function buildCar(model){
  // source model: length along z, front = -z. Rotate so front = +x, right side = +z; scale to the real 4658 mm length.
  const inner=new THREE.Group();inner.add(model);
  const b0=new THREE.Box3().setFromObject(model);const lenRaw=b0.max.z-b0.min.z;
  const sc=4.66/lenRaw; inner.scale.setScalar(sc); inner.rotation.y=-Math.PI/2;
  carRoot.add(inner);inner.updateMatrixWorld(true);
  const b1=new THREE.Box3().setFromObject(model);inner.position.set(-(b1.min.x+b1.max.x)/2,-b1.min.y+0.002,-(b1.min.z+b1.max.z)/2);
  inner.updateMatrixWorld(true);
  window.__inner=inner;

  // hood: separate the hood panel (one connected piece of the body paint mesh) so it can open
  let hoodMesh=null;
  model.traverse(o=>{if(o.isMesh&&o.parent&&/^KASA/.test(o.parent.name)&&o.material&&o.material.name==='primary'&&!hoodMesh){
    hoodMesh=splitTriangles(o,(box,n)=>n>1500&&box.max.x>1.8&&box.min.x>0.95&&box.min.y>0.68&&(box.max.z-box.min.z)>1.3&&(box.max.x-box.min.x)<1.2);}});

  // materials
  const seen=new Set();
  model.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;
    let m=o.material;
    if(m.name==='primary'){ if(!paintMat){paintMat=new THREE.MeshPhysicalMaterial({color:PAINTS[0].c,metalness:0.45,roughness:0.3,clearcoat:1,clearcoatRoughness:0.05,envMapIntensity:0.9});paintMat.name='primary';} o.material=paintMat; }
    else if(/glass|KAPI_3\.3|KAPI 3\.3/.test(m.name)){ if(!m.userData.g){m.transparent=true;m.opacity=Math.min(m.opacity,0.55);m.depthWrite=false;m.userData.g=1;glassMats.push(m);} o.renderOrder=2; }
    if(/right.front.light/i.test(m.name)){ // lamps: split headlamp / tail lamp materials so they glow in their own colour
      const tail=/STOP|R_glass|Gum_33/.test(o.parent.name+o.name);
      const key=tail?'_tail':'_head';
      if(!m.userData[key]){const c=m.clone();c.emissive=new THREE.Color(0);c.userData.lamp=tail?'tail':'head';m.userData[key]=c;}
      o.material=m.userData[key];
    }
  });
  const fabric=new THREE.MeshStandardMaterial({color:0x3a3d42,roughness:0.95});fabric.name='fabric';
  model.traverse(o=>{if(o.isMesh&&o.parent&&/^stwheel_1/.test(o.parent.name))o.material=fabric;});
  model.traverse(o=>{if(o.isMesh&&!seen.has(o.material)){seen.add(o.material);const m=o.material;m.side=THREE.DoubleSide;m.clippingPlanes=[cutPlane];m.userData.baseOpacity=m.opacity;m.userData.baseTransparent=m.transparent;if(m.envMapIntensity!==undefined&&m!==paintMat)m.envMapIntensity=0.5;CAR_MATS.push(m);}});
  if(hoodMesh)hoodMesh.material=paintMat;

  const W=(node)=>new THREE.Box3().setFromObject(node);
  const find=n=>{let r=null;model.traverse(o=>{if(!r&&o.name===n)r=o;});return r;};
  // wheels -> axle geometry
  const wheels=['default13131','default13131001','default13131002','default13131003'].map(find).filter(Boolean);
  const wc=wheels.map(w=>W(w));
  if(wc.length===4){const xs=wc.map(b=>(b.min.x+b.max.x)/2),zs=wc.map(b=>(b.min.z+b.max.z)/2);
    GEO.FX=Math.max(...xs);GEO.RX=Math.min(...xs);GEO.WR=(wc[0].max.y-wc[0].min.y)/2;GEO.TRACK=Math.max(...zs.map(Math.abs));}
  wheels.forEach((w,i)=>{const b=wc[i],s=Math.sign((b.min.z+b.max.z)/2);const inf=INFO[w.name];w.userData.part={cat:inf[0],name:inf[1],desc:inf[2]};reg(w,CAT.whl,null,null,[0,0,s*0.55]);});

  // pivots
  function pivotAt(node,p){const pv=new THREE.Group();pv.position.copy(p);carRoot.add(pv);pv.updateMatrixWorld(true);pv.attach(node);return pv;}
  [['KAPI_3',true],['KAPI_1',true],['KAPI2',false],['KAPI_4',false]].forEach(([n,front])=>{
    const d=find(n);if(!d)return;const b=W(d),sg=Math.sign(b.min.z+b.max.z);

    const inf=INFO[n];d.userData.part={cat:inf[0],name:inf[1],desc:inf[2]};
    reg(pv,CAT.body,null,null,[0,0.05,sg*0.85]);
  });
  const bg=find('BAGAJ');
  if(bg){const b=W(bg);const tg=new THREE.Group();carRoot.add(tg);
    trunk=pivotAt(tg,new THREE.Vector3(b.max.x-0.02,b.max.y-0.01,0));
    trunk.attach(bg);const ch=find('chrome_7');if(ch)trunk.attach(ch);
    const inf=INFO.BAGAJ;bg.userData.part={cat:inf[0],name:inf[1],desc:inf[2]};
    reg(trunk,CAT.trk,null,null,[-0.35,0.75,0]);}
  if(hoodMesh){const b=W(hoodMesh);hood=pivotAt(hoodMesh,new THREE.Vector3(b.min.x+0.02,b.max.y-0.02,0));
    const inf=INFO.HOOD;hoodMesh.userData.part={cat:inf[0],name:inf[1],desc:inf[2]};reg(hood,CAT.body,null,null,[0.2,0.9,0]);}
  // catalogue info for the remaining nodes
  model.traverse(o=>{const k=o.name.replace(/[^A-Za-z0-9_]/g,'');if(INFO[k]&&!o.userData.part){const i=INFO[k];o.userData.part={cat:i[0],name:i[1],desc:i[2]};}});
  const kasa=find('KASA');if(kasa)reg(kasa,CAT.body,null,null,[0,0,0]);
  const bump=find('tampomn');
  bodyNodes=[inner];
  model.traverse(o=>{if(o.isMesh&&o.parent&&/^stwheel_1/.test(o.parent.name)&&!window.__dashOld){
    const old=splitTriangles(o,(box,n)=>{const c=box.getCenter(new THREE.Vector3());const dash=c.x>0.30&&box.min.x>0.1&&box.max.y>0.75&&box.min.y>0.25&&Math.abs(c.z)<0.8;const stick=c.x>0.4&&c.x<0.6&&box.max.y<0.75&&box.min.y>0.5&&Math.abs(c.z)<0.1;return dash||stick;});
    if(old){window.__dashOld=old;old.updateMatrixWorld(true);DASH_BOX=new THREE.Box3().setFromObject(old);old.visible=false;old.userData.hidden=true;}}});
  window.__find=find;
  buildInteriorAdds(find);
  buildChassis();
}

/* ---------- real Astra J dashboard scan (replaces the simple game-model dash) ---------- */
function buildDash(sc){
  const holder=new THREE.Group();const inner=new THREE.Group();holder.add(inner);inner.add(sc);
  inner.rotation.y=-Math.PI/2; // scan faces +z with the wheel at -x  ->  faces the driver (-x) with the wheel on the left (-z)
  inner.scale.setScalar(DASH_S);holder.updateMatrixWorld(true);
  const b=new THREE.Box3().setFromObject(sc);
  const t=DASH_BOX||new THREE.Box3(new THREE.Vector3(0.35,0.5,-0.75),new THREE.Vector3(1.0,1.1,0.75));
  inner.position.set(t.max.x+DASH_OFF[0]-b.max.x,t.max.y+DASH_OFF[1]-b.max.y,DASH_OFF[2]-(b.min.z+b.max.z)/2);
  carRoot.add(holder);dashScan=holder;window.__dash=holder;holder.updateMatrixWorld(true);
  // drop loose scan fragments (islands) – keeps the connected dashboard surface
  sc.traverse(o=>{if(!o.isMesh||o.userData.cleaned)return;o.userData.cleaned=1; // per-triangle cleanup of scan fringe (footwells, door gaps)
    const g=o.geometry,pos=g.attributes.position,idx=g.index.array,keep=[],v=new THREE.Vector3(),c=new THREE.Vector3();
    for(let t=0;t<idx.length;t+=3){c.set(0,0,0);for(let k=0;k<3;k++)c.add(v.fromBufferAttribute(pos,idx[t+k]).applyMatrix4(o.matrixWorld));c.multiplyScalar(1/3);
      const az=Math.abs(c.z);
      if(c.y<0.62&&az>0.17)continue;          // footwell / floor fragments
      if(az>0.71)continue;                   // door-gap fragments
      if(c.x<0.30&&c.y<0.66&&az>0.10)continue; // loose sheet behind the console
      if(c.z>0.18&&c.x<0.56)continue;        // stray sheet behind the passenger side of the dash
      if(az>0.6&&c.y>1.05)continue;          // A-pillar fragments
      keep.push(idx[t],idx[t+1],idx[t+2]);}
    g.setIndex(keep);});
  const ws=new THREE.Plane(new THREE.Vector3(-0.14,-1,0).normalize(),0);ws.constant=-ws.normal.dot(new THREE.Vector3(1.30,1.085,0)); // stay under the windscreen line
  // the scan's upper dash top is patchy (window reflections): give that region a plain soft-touch dark plastic
  sc.traverse(o=>{if(!o.isMesh||o.userData.split)return;o.userData.split=1;const g=o.geometry,pos=g.attributes.position,idx=g.index.array,keep=[],top=[],v=new THREE.Vector3(),c=new THREE.Vector3();
    for(let t=0;t<idx.length;t+=3){c.set(0,0,0);for(let k=0;k<3;k++)c.add(v.fromBufferAttribute(pos,idx[t+k]).applyMatrix4(o.matrixWorld));c.multiplyScalar(1/3);
      const dst=(c.y>0.985&&c.x>0.70&&!(Math.abs(c.z+0.37)<0.20&&c.x<0.86))?top:keep;dst.push(idx[t],idx[t+1],idx[t+2]);}
    g.setIndex(keep);const g2=g.clone();g2.setIndex(top);
    const m2=new THREE.Mesh(g2,new THREE.MeshStandardMaterial({color:0x202226,roughness:0.85}));m2.position.copy(o.position);m2.quaternion.copy(o.quaternion);m2.scale.copy(o.scale);o.parent.add(m2);});
  sc.traverse(o=>{if(o.isMesh){o.material.side=THREE.DoubleSide;o.material.clippingPlanes=[cutPlane,ws,new THREE.Plane(new THREE.Vector3(0,1,0),-0.36),new THREE.Plane(new THREE.Vector3(-1,0,0),1.30)];o.castShadow=false;o.receiveShadow=false;}});
  holder.userData.part={cat:CAT.int,name:'Ön konsol (gerçek Astra J taraması)',desc:'Gerçek bir Astra J iç mekânının 3D taraması: analog gösterge paneli (devir ve hız saati, ortada yol bilgisayarı), Opel amblemli 3 kollu direksiyon, krom çerçeveli orta konsol, CD 300 / multimedya ve klima tuşları, kalorifer ızgaraları ve 5 ileri manuel vites kolu.'};
  reg(holder,CAT.int,null,null,[0.25,0.55,0]);
}

function buildEngine(sc){

  holder.updateMatrixWorld(true);
  let b=new THREE.Box3().setFromObject(sc);
  const s=0.97;inner.scale.setScalar(s);holder.updateMatrixWorld(true);
  b=new THREE.Box3().setFromObject(sc);
  const hb=hood?new THREE.Box3().setFromObject(hood):new THREE.Box3(new THREE.Vector3(1.17,0.8,-0.8),new THREE.Vector3(2.0,1.0,0.8));
  const rearX=hb.min.x-0.04, topY=hb.max.y-0.07;
  const cx=(hb.min.x+hb.max.x)/2-0.02;inner.position.set(cx-(b.min.x+b.max.x)/2,topY-b.max.y,-(b.min.z+b.max.z)/2);
  const k=(hb.max.y-hb.min.y)/(hb.max.x-hb.min.x); // hood slope: clip the scan just under the hood skin
  carRoot.add(holder);engineScan=holder;
  const frontLimit=GEO.FX+0.60;
  sc.traverse(o=>{if(o.isMesh){o.material.side=THREE.DoubleSide;o.material.clippingPlanes=[new THREE.Plane(new THREE.Vector3(-1,0,0),frontLimit),new THREE.Plane(new THREE.Vector3(-k,-1,0),hb.max.y+k*hb.min.x-0.075)];o.castShadow=false;}});
  holder.userData.part={cat:INFO.ENGINE[0],name:INFO.ENGINE[1],desc:INFO.ENGINE[2]};
  reg(holder,CAT.eng,null,null,[0,0.65,0]);
}

/* ================= free camera: zoom to the point under the finger, double-tap to re-centre ================= */
const _rcz=new THREE.Raycaster();
function pickPoint(cx,cy){const r=renderer.domElement.getBoundingClientRect(),v=new THREE.Vector2((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1);
  _rcz.setFromCamera(v,camera);const h=_rcz.intersectObject(mode==='lab'&&engRoot?engRoot:carRoot,true).find(h=>isVisible(h.object)&&!(h.object.material&&h.object.material.transparent&&h.object.material.opacity<0.3));
  if(h)return h.point.clone();return _rcz.ray.at(Math.max(0.3,camera.position.distanceTo(controls.target)),new THREE.Vector3());}
function zoomAt(P,f){ // homothety around P: P stays under the finger, view direction is kept
  camAnim=null;const d=camera.position.distanceTo(P);
  if(f>0&&d<0.06){const dir=new THREE.Vector3();camera.getWorldDirection(dir);const step=0.04*f/0.1;camera.position.addScaledVector(dir,step);controls.target.addScaledVector(dir,step);return;}
  if(f<0&&d>25)return;

let wheelP=null,wheelT=0;
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();const now=performance.now();if(!wheelP||now-wheelT>250)wheelP=pickPoint(e.clientX,e.clientY);wheelT=now;
  zoomAt(wheelP,clamp(-e.deltaY*0.0015,-0.3,0.3));},{passive:false});

/* ================= loop ================= */
const clock=new THREE.Clock();let RD=0.016;
const damp=(c,t,k)=>lerp(c,t,1-Math.exp(-k*RD));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function tick(){
  RD=Math.min(clock.getDelta(),0.25);
  ['doors','trunk','hood','explode','xray','bodyHidden','cut'].forEach(k=>{S[k]=damp(S[k],T[k],k==='explode'?3.5:4.5);});
  for(const k in DOORS){const d=DOORS[k];d.rotation.y=d.userData.sgn*(d.userData.front?1.15:1.05)*ease(clamp(S.doors,0,1));}
  if(trunk)trunk.rotation.z=-1.15*ease(clamp(S.trunk,0,1));
  if(hood)hood.rotation.z=1.0*ease(clamp(S.hood,0,1));
  const f=S.explode;for(const p of parts){p.obj.position.copy(p.base).addScaledVector(p.ex,f*1.6);}
  const op=1-S.xray*0.88;
  CAR_MATS.forEach(m=>{const tr=m.userData.baseTransparent||op<0.985;if(m.transparent!==tr){m.transparent=tr;m.needsUpdate=true;}m.opacity=Math.min(m.userData.baseOpacity,op);if(!m.userData.baseTransparent)m.depthWrite=!tr;});
  glassMats.forEach(m=>{m.opacity=Math.min(m.opacity,(mode==='drv'||mode==='int')?0.25:0.55);});
  cutPlane.constant=lerp(50,1.20,ease(clamp(S.cut,0,1)));
  const bodyVis=S.bodyHidden<0.5;
  if(window.__inner)window.__inner.traverse(o=>{if(o.isMesh){const wheel=/default13131/.test(o.parent&&o.parent.name);o.visible=!o.userData.hidden&&(bodyVis||wheel);}});
  if(dashScan)dashScan.visible=bodyVis;
  [hood,trunk,...Object.values(DOORS)].forEach(o=>{if(o)o.visible=bodyVis;});
  if(interiorAdds)interiorAdds.visible=bodyVis;
  if(window.__chs)window.__chs.visible=(mode==='chs'||mode==='xr'||S.xray>0.05||S.bodyHidden>0.05);
  S.labEx=damp(S.labEx,T.labEx,4);
  const lab=mode==='lab';carRoot.visible=!lab;if(engRoot){engRoot.visible=lab;engRoot.userData.stand.visible=lab&&!(LABF&&LABF.iso);if(lab){ENG.parts.forEach(p=>p.obj.position.copy(p.base).addScaledVector(p.ex,S.labEx));}}
  const hgm=hsGroupForMode();HS.forEach(h=>{h.sprite.visible=!!hgm&&h.g===hgm&&(!FOCUS||(!FOCUS.iso)||FOCUS.h===h)&&!(FOCUS&&FOCUS.iso);});
  if(engineScan)engineScan.visible=S.hood>0.05||S.explode>0.05||S.xray>0.05||S.bodyHidden>0.05;
  const iso=!!(FOCUS&&FOCUS.iso);[floor,disk,ring,contact].forEach(o=>o.visible=!iso);
  cabinLight.intensity=damp(cabinLight.intensity,mode==='int'?3.2:mode==='drv'?2.0:0,3);
  if(camAnim){camAnim.t=(performance.now()-camAnim.s0)/1000/camAnim.d;const e=ease(clamp(camAnim.t,0,1));camera.position.lerpVectors(camAnim.p0,camAnim.p1,e);controls.target.lerpVectors(camAnim.t0,camAnim.t1,e);if(camAnim.t>=1)camAnim=null;}
  renderer.toneMappingExposure=damp(renderer.toneMappingExposure,mode==='drv'?1.9:mode==='int'?1.35:1.0,3);
  if(flashT>0){flashT-=RD;if(flashT<=0)unflash();}
  controls.update();renderer.render(scene,camera);requestAnimationFrame(tick);
}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.fov=w<h?52:38;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
if(stage.clientWidth<stage.clientHeight){Object.entries(cams).forEach(([k,c])=>{if(k==='drv')return;const F={ext:1.2,eng:1.35,int:1.5}[k]||1.5;const p=new THREE.Vector3(...c.p),t=new THREE.Vector3(...c.t);p.sub(t).multiplyScalar(F).add(t);c.p=p.toArray();});camera.position.set(...cams.ext.p);}
renderRail();renderSub();tick();
function finish(){renderSub();$('#loader').style.opacity=0;setTimeout(()=>{const l=$('#loader');if(l)l.remove();},500);setTimeout(()=>{$('#hint').style.opacity=0;},7000);window.READY=1;}
window.__astra={setMode,S,T,camera,controls,GEO,HS,focusHS,isolateHS,get ENG(){return ENG;},labFocus,labIso,get hood(){return hood;},get eng(){return engineScan;}};
})();
</script>
